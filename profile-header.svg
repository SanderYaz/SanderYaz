<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">Sander Yazıcıoğlu — Senior Frontend Developer</title>
  <desc id="description">Animated professional banner highlighting frontend architecture, SaaS engineering, performance, UX, Angular, React, Next.js, TypeScript, and Node.js.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117" />
      <stop offset="0.52" stop-color="#111827" />
      <stop offset="1" stop-color="#161B22" />
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.65" />
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" />
      <stop offset="0.5" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#2EA043" />
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="roundedFrame">
      <rect width="1200" height="330" rx="28" />
    </clipPath>
  </defs>

  <style><![CDATA[
    .name {
      fill: #F0F6FC;
      font: 700 48px "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      letter-spacing: 0.4px;
    }

    .role {
      fill: #C9D1D9;
      font: 500 22px "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      letter-spacing: 0.7px;
    }

    .rotating {
      fill: #58A6FF;
      font: 600 19px "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      letter-spacing: 0.6px;
      opacity: 0;
    }

    .meta {
      fill: #8B949E;
      font: 500 15px "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      letter-spacing: 0.35px;
    }

    .chip-text {
      fill: #E6EDF3;
      font: 600 14px "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      letter-spacing: 0.25px;
    }

    .grid-flow {
      animation: dash 16s linear infinite;
    }

    .glow-blue {
      animation: pulseBlue 7s ease-in-out infinite;
      transform-origin: 160px 90px;
    }

    .glow-purple {
      animation: pulsePurple 8s ease-in-out infinite;
      transform-origin: 1040px 245px;
    }

    .node-a { animation: floatA 6s ease-in-out infinite; }
    .node-b { animation: floatB 7.5s ease-in-out infinite; }
    .node-c { animation: floatC 8.5s ease-in-out infinite; }

    #line-one { animation: lineOne 12s ease-in-out infinite; }
    #line-two { animation: lineTwo 12s ease-in-out infinite; }
    #line-three { animation: lineThree 12s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .grid-flow,
      .glow-blue,
      .glow-purple,
      .node-a,
      .node-b,
      .node-c,
      #line-one,
      #line-two,
      #line-three {
        animation: none !important;
      }

      #line-one { opacity: 1; }
      #line-two,
      #line-three { opacity: 0; }
    }

    @keyframes dash {
      to { stroke-dashoffset: -240; }
    }

    @keyframes pulseBlue {
      0%, 100% { opacity: 0.48; transform: scale(1); }
      50% { opacity: 0.72; transform: scale(1.12); }
    }

    @keyframes pulsePurple {
      0%, 100% { opacity: 0.42; transform: scale(1.04); }
      50% { opacity: 0.66; transform: scale(0.94); }
    }

    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(14px, -8px); }
    }

    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-12px, 10px); }
    }

    @keyframes floatC {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(8px, 12px); }
    }

    @keyframes lineOne {
      0%, 27% { opacity: 1; }
      32%, 100% { opacity: 0; }
    }

    @keyframes lineTwo {
      0%, 31% { opacity: 0; }
      36%, 61% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }

    @keyframes lineThree {
      0%, 65% { opacity: 0; }
      70%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }
  ]]></style>

  <g clip-path="url(#roundedFrame)">
    <rect width="1200" height="330" fill="url(#background)" />

    <circle class="glow-blue" cx="160" cy="90" r="240" fill="url(#blueGlow)" />
    <circle class="glow-purple" cx="1040" cy="245" r="260" fill="url(#purpleGlow)" />

    <g opacity="0.12" stroke="#8B949E" stroke-width="1">
      <path class="grid-flow" stroke-dasharray="4 10" d="M0 56 H1200 M0 110 H1200 M0 164 H1200 M0 218 H1200 M0 272 H1200" />
      <path class="grid-flow" stroke-dasharray="4 12" d="M80 0 V330 M200 0 V330 M320 0 V330 M440 0 V330 M560 0 V330 M680 0 V330 M800 0 V330 M920 0 V330 M1040 0 V330 M1160 0 V330" />
    </g>

    <g opacity="0.55" fill="none" stroke="url(#accent)" stroke-width="1.4">
      <path d="M42 244 C155 185 204 289 323 226 S523 175 634 235 S845 287 973 218 S1101 196 1172 232" />
    </g>

    <g class="node-a" filter="url(#softGlow)">
      <circle cx="104" cy="238" r="5" fill="#58A6FF" />
      <circle cx="104" cy="238" r="12" fill="none" stroke="#58A6FF" stroke-opacity="0.3" />
    </g>
    <g class="node-b" filter="url(#softGlow)">
      <circle cx="1088" cy="90" r="5" fill="#8B5CF6" />
      <circle cx="1088" cy="90" r="12" fill="none" stroke="#8B5CF6" stroke-opacity="0.3" />
    </g>
    <g class="node-c" filter="url(#softGlow)">
      <circle cx="1000" cy="264" r="4" fill="#2EA043" />
      <circle cx="1000" cy="264" r="10" fill="none" stroke="#2EA043" stroke-opacity="0.3" />
    </g>

    <rect x="34" y="28" width="1132" height="274" rx="22" fill="none" stroke="#30363D" stroke-width="1" />
    <rect x="35" y="29" width="1130" height="2" rx="1" fill="url(#accent)" opacity="0.82" />

    <text x="600" y="88" text-anchor="middle" class="name">Sander Yazıcıoğlu</text>
    <text x="600" y="124" text-anchor="middle" class="role">Senior Frontend Developer · Software Engineer</text>

    <g text-anchor="middle">
      <text id="line-one" x="600" y="164" class="rotating">Scalable frontend architecture for high-traffic products</text>
      <text id="line-two" x="600" y="164" class="rotating">Angular · React · Next.js · TypeScript · Node.js</text>
      <text id="line-three" x="600" y="164" class="rotating">Performance · UX · Maintainability · Developer Experience</text>
    </g>

    <g transform="translate(272 194)">
      <g transform="translate(0 0)">
        <rect width="116" height="38" rx="19" fill="#161B22" stroke="#58A6FF" stroke-opacity="0.65" />
        <text x="58" y="24" text-anchor="middle" class="chip-text">Angular</text>
      </g>
      <g transform="translate(130 0)">
        <rect width="106" height="38" rx="19" fill="#161B22" stroke="#58A6FF" stroke-opacity="0.52" />
        <text x="53" y="24" text-anchor="middle" class="chip-text">React</text>
      </g>
      <g transform="translate(250 0)">
        <rect width="116" height="38" rx="19" fill="#161B22" stroke="#8B5CF6" stroke-opacity="0.6" />
        <text x="58" y="24" text-anchor="middle" class="chip-text">Next.js</text>
      </g>
      <g transform="translate(380 0)">
        <rect width="134" height="38" rx="19" fill="#161B22" stroke="#8B5CF6" stroke-opacity="0.52" />
        <text x="67" y="24" text-anchor="middle" class="chip-text">TypeScript</text>
      </g>
      <g transform="translate(528 0)">
        <rect width="128" height="38" rx="19" fill="#161B22" stroke="#2EA043" stroke-opacity="0.58" />
        <text x="64" y="24" text-anchor="middle" class="chip-text">Node.js</text>
      </g>
    </g>

    <text x="600" y="274" text-anchor="middle" class="meta">İzmir, Türkiye · 6+ years building scalable SaaS products</text>
  </g>
</svg>
